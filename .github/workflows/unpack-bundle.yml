# One-off helper: writes the files in ds-bundle.b64 (gzipped JSON) into the repo,
# installs dependencies, regenerates the theme, checks the build, then deletes the
# bundle. Used to load the design system editor code from the browser. Safe to delete.
name: Unpack bundle

on:
  push:
    branches: [main]
    paths: ["ds-bundle.b64"]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write files from the bundle
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os
          raw = gzip.decompress(base64.b64decode(open("ds-bundle.b64").read().strip()))
          data = json.loads(raw)
          for path, content in data["files"].items():
              assert not path.startswith(".github/") and ".." not in path, path
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w") as f:
                  f.write(content)
              print("wrote", path)
          os.remove("ds-bundle.b64")
          PY

      - name: Install dependencies (updates package-lock.json)
        run: npm install --no-audit --no-fund

      - name: Generate theme files from tokens
        run: npm run ds:build

      - name: Build check
        run: npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add design system editor"
          git push
